services:
  halendar-api:
    depends_on:
      - postgres
      - ollama
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halendar-api
    ports:
      - "127.0.0.1:4355:4354"
    env_file:
      - .env
    volumes:
      - halendar-api:/app/data
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: halendar-ollama
    restart: always
    # Loopback-only, like postgres' 5433 mapping below: reachable from this
    # host (e.g. an API run natively with `go run` for local dev, outside
    # this compose network) but never from outside it.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:1b}
    volumes:
      - halendar-ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama serve &
        server_pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        if ! ollama list | tail -n +2 | awk '{print $$1}' | grep -qx "$$OLLAMA_MODEL"; then
          echo "Pulling model $$OLLAMA_MODEL ..."
          ollama pull "$$OLLAMA_MODEL"
        else
          echo "Model $$OLLAMA_MODEL already present, skipping pull."
        fi
        wait "$$server_pid"

  postgres:
    image: postgres:15.5
    restart: always
    container_name: halendar-postgres
    shm_size: '2gb'
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - .env
    volumes:
      - halendar-db:/var/lib/postgresql/data
      - config_files:/etc/postgresql/
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
  
  adminer:
    image: adminer:latest
    container_name: halendar-adminer
    restart: always
    ports:
      - 8088:8080

networks:
  mynet:
    driver: bridge

volumes:
  halendar-db:
    external: true

  halendar-api:
    external: true

  halendar-ollama:
    external: true

  config_files:
    external: true
